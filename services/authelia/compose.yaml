version: "3.3"
services:
  authelia:
    image: authelia/authelia:latest
    container_name: authelia
    networks:
      - dockervlan
    user: "1000:1000"
    environment:
      - TZ=Europe/Madrid
    volumes:
      - /opt/docker-volumes/data/authelia:/config
    restart: unless-stopped
    labels:
      - "wud.update=true"
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.docker.network=dockervlan"

      # 🌐 Router para acceder a la web de login (auth.example.com)
      - "traefik.http.routers.authelia-rtr.entrypoints=websecure"
      - "traefik.http.routers.authelia-rtr.rule=Host(`auth.example.com`)"
      - "traefik.http.routers.authelia-rtr.tls=true"
      - "traefik.http.routers.authelia-rtr.service=authelia-svc"
      - "traefik.http.services.authelia-svc.loadbalancer.server.port=9091"

      # 🛡️ EL ESCUDO: Creación del Middleware de Autenticación para Traefik
      - "traefik.http.middlewares.authelia-auth.forwardauth.address=http://authelia:9091/api/verify?rd=https%3A%2F%2Fauth.example.com%2F"
      - "traefik.http.middlewares.authelia-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.authelia-auth.forwardauth.authResponseHeaders=Remote-User,Remote-Groups,Remote-Name,Remote-Email"

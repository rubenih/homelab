version: "3.3"

services:
  paperless-redis:
    image: redis:7-alpine
    container_name: paperless-redis
    networks:
      - dockervlan
    restart: unless-stopped
    volumes:
      - /opt/docker-volumes/data/paperless/redis:/data

  paperless-db:
    image: postgres:15-alpine
    container_name: paperless-db
    networks:
      - dockervlan
    restart: unless-stopped
    environment:
      - POSTGRES_USER=paperless
      - POSTGRES_PASSWORD_FILE=/run/secrets/paperless_postgres_password
      - POSTGRES_DB=paperless
    secrets:
      - paperless_postgres_password
    volumes:
      - /opt/docker-volumes/data/paperless/db:/var/lib/postgresql/data

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless
    networks:
      - dockervlan
    restart: unless-stopped

    depends_on:
      - paperless-db
      - paperless-redis

    environment:
      - USERMAP_UID=1000
      - USERMAP_GID=1000
      - TZ=Europe/Madrid
      - PAPERLESS_REDIS=redis://paperless-redis:6379
      - PAPERLESS_DBHOST=paperless-db
      - PAPERLESS_DBUSER=paperless
      - PAPERLESS_DBPASS_FILE=/run/secrets/paperless_postgres_password
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_URL=https://paperless.example.com
      - PAPERLESS_SECRET_KEY_FILE=/run/secrets/paperless_secret_key
      - PAPERLESS_OCR_LANGUAGE=spa+eng
      - PAPERLESS_TIME_ZONE=Europe/Madrid
      - PAPERLESS_PRE_CONSUME_SCRIPT=/scripts/decrypt-pdf.sh

    secrets:
      - paperless_postgres_password
      - paperless_secret_key

    labels:
      - "wud.update=true"
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.docker.network=dockervlan"
      - "traefik.http.routers.paperless-rtr.entrypoints=websecure"
      - "traefik.http.routers.paperless-rtr.rule=Host(`paperless.example.com`)"
      - "traefik.http.routers.paperless-rtr.tls=true"
      - "traefik.http.routers.paperless-rtr.service=paperless-svc"
      - "traefik.http.services.paperless-svc.loadbalancer.server.port=8000"
      - "traefik.http.routers.paperless-rtr.middlewares=authelia-auth@docker"

    volumes:
      - /mnt/paperless/data:/usr/src/paperless/data
      - /mnt/paperless/media:/usr/src/paperless/media
      - /mnt/paperless/export:/usr/src/paperless/export
      - /mnt/paperless/consume:/usr/src/paperless/consume
      - /opt/docker-volumes/data/paperless/scripts:/scripts

networks:
  dockervlan:
    external: true

secrets:
  paperless_postgres_password:
    file: /etc/lab-secrets/paperless/postgres_password

  paperless_secret_key:
    file: /etc/lab-secrets/paperless/secret_key
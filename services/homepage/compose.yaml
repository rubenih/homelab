version: "3.3"
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    networks:
      - dockervlan
    environment:
      PUID: 1000 
      PGID: 1000
      HOMEPAGE_ALLOWED_HOSTS: homepage.example.com,10.0.31.100,localhost  
    labels:
      # Habilitar etiquetas específicas para WUD
      - "wud.update=true"
      
      - "traefik.enable=true"
      - "traefik.docker.network=dockervlan"
      # HTTP Routers
      - "traefik.http.routers.homepage-rtr.entrypoints=websecure"
      - "traefik.http.routers.homepage-rtr.rule=Host(`homepage.example.com`)"
      - "traefik.http.routers.homepage-rtr.tls=true"
      ## HTTP Services
      - "traefik.http.routers.homepage-rtr.service=homepage-svc"
      - "traefik.http.services.homepage-svc.loadbalancer.server.port=3000"
      - "traefik.http.routers.homepage-rtr.middlewares=authelia-auth@docker"

      # LA ETIQUETA MÁGICA DE WATCHTOWER:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /opt/docker-volumes/data/homepage/config:/app/config 
      - /var/run/docker.sock:/var/run/docker.sock:ro 
    restart: unless-stopped

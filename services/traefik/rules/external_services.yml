http:
  routers:
    # --- PROXMOX ---
    proxmox-rtr:
      rule: "Host(`proxmox.example.com`)"
      entryPoints:
        - websecure
      service: proxmox-svc
      tls:
        certResolver: dns-cloudflare  # <--- AQUÍ ESTÁ TU NOMBRE

    # --- TRUENAS ---
    truenas-rtr:
      rule: "Host(`truenas.example.com`)"
      entryPoints:
        - websecure
      service: truenas-svc
      tls:
        certResolver: dns-cloudflare

    # --- UNIFI ---
    unifi-rtr:
      rule: "Host(`unifi.example.com`)"
      entryPoints:
        - websecure
      service: unifi-svc
      tls:
        certResolver: dns-cloudflare

  services:
    proxmox-svc:
      loadBalancer:
        servers:
          - url: "https://10.0.30.16:8006"
        passHostHeader: true

    truenas-svc:
      loadBalancer:
        servers:
          - url: "https://10.0.31.101" # Asumiendo que TrueNAS usa 443, si es otro ponlo aquí
        passHostHeader: true

    unifi-svc:
      loadBalancer:
        servers:
          - url: "https://10.0.10.10:8443"
        passHostHeader: true

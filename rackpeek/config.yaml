  notes: |
    ## Identidad y función
    Modelo indicado en el diagrama: HUNSN NRJ55k. Hostname: mars.
    Proxmox principal, independiente de earth; no hay clúster ni QDevice.
    Gestión: 10.0.10.26/24; gateway 10.0.10.1.
    CPU i3-N305, 32 GB RAM y NVMe de 512 GB según el diagrama.
    Modelo y SN del NVMe pendientes.

    ## Ethernet: contraste con las salidas de mars del 06-11-2026
    Las ocho interfaces son Intel I226-V [8086:125c], controlador igc,
    y todas admiten 2500baseT/Full. Se corrige la clasificación inicial de
    ETH0-ETH3 como puertos limitados a 1 Gb/s: esa es la velocidad negociada
    con el Cisco, no la capacidad máxima del hardware.
    Grupo 0: cuatro puertos integrados de 2,5 Gb/s, ETH0-ETH3.
      Índice 0 = ETH0: gestión, vmbr0 -> switch GE2.
      Índice 1 = ETH1: destino histórico del puerto superior de earth,
                        vmbr1 / Wake-on-LAN; cable actual pendiente.
      Índice 2 = ETH2: trunk, vmbr2 -> switch GE4.
      Índice 3 = ETH3: enlace NAS, vmbrNAS -> QNAP puerto 4.
    Grupo 1: tarjeta Intel adicional, cuatro puertos de 2,5 Gb/s, ETH4-ETH7.
      Índices 0, 1, 2, 3 = ETH4, ETH5, ETH6, ETH7 respectivamente.
    La tarjeta adicional sigue instalada y está SIN USAR. Se intentó
    desactivarla para reducir consumo; no se documenta como desactivada.
    nic0-nic3 aparecen administrativamente DOWN y sin enlace detectado;
    los cuatro controladores siguen presentes en PCI y con driver igc.

    ## Correspondencia exacta de nombres, MAC y PCI
    ETH0 = nic4, XX:XX:XX:XX:XX:XX, PCI 0000:09:00.0, vmbr0.
    ETH1 = nic5, XX:XX:XX:XX:XX:XX, PCI 0000:0a:00.0, vmbr1.
    ETH2 = nic6, XX:XX:XX:XX:XX:XX, PCI 0000:0b:00.0, vmbr2.
    ETH3 = nic7, XX:XX:XX:XX:XX:XX, PCI 0000:0c:00.0, vmbrNAS.
    ETH4 = nic0, XX:XX:XX:XX:XX:XX, PCI 0000:04:00.0, sin bridge.
    ETH5 = nic1, XX:XX:XX:XX:XX:XX, PCI 0000:05:00.0, sin bridge.
    ETH6 = nic2, XX:XX:XX:XX:XX:XX, PCI 0000:07:00.0, sin bridge.
    ETH7 = nic3, XX:XX:XX:XX:XX:XX, PCI 0000:08:00.0, sin bridge.
    Firmware informado: nic0-nic3 2014:8877; nic4-nic7 2013:8877.

    ## Estado de los enlaces en la captura
    ETH0/nic4 y ETH2/nic6: 1000 Mb/s, full duplex, enlace detectado.
    ETH3/nic7: 2500 Mb/s, full duplex, enlace detectado.
    ETH1/nic5: habilitada administrativamente, sin portadora detectada.
    El comentario de vmbr1 sigue indicando WoL hacia el puerto superior de earth.
    La falta de portadora no permite establecer si el cable está desconectado
    o si el extremo remoto está sin enlace.

    ## Bridges y VLAN efectivos
    vmbr0 -> nic4: gestión 10.0.10.26/24, gateway 10.0.10.1.
    vmbr1 -> nic5: sin IP, enlace WoL documentado.
    vmbr2 -> nic6: bridge VLAN-aware, bridge-vids 2-4094;
      en el puerto nic6 figuran PVID1 sin etiquetar y VLAN 2-4094 etiquetadas.
    vmbrNAS -> nic7: 10.10.10.3/29, sin filtrado VLAN.
    Solo vmbr2 tiene vlan_filtering=1; vmbr0, vmbr1 y vmbrNAS tienen valor 0.
    Los cuatro bridges tienen MTU1500, STP desactivado y forward-delay0.
    La VLAN1 interna de los bridges sin filtrado no acredita una VLAN1 en el
    switch. La VLAN de acceso de gestión se determina en el extremo Cisco.

    Tabla de puertos virtuales activos observada:
    VM100 net0 / tap100i0 -> vmbr2, VLAN31.
    VM100 net1 / tap100i1 -> vmbr2, VLAN50.
    VM100 net2 / tap100i2 -> vmbrNAS, sin etiqueta VLAN.
    VM666 net0 / tap666i0 -> vmbr2, VLAN30.
    LXC101 net0 / veth101i0 -> vmbr2, VLAN10.
    LXC102 net0 / veth102i0 -> vmbr2, VLAN31.
    Las MAC de tap/veth del host no se confunden con las MAC de los invitados.

    ## Red NAS actual
    10.10.10.0/29 (255.255.255.248):
    - QNAP: 10.10.10.1/29.
    - VM Ubuntu / docker-server: 10.10.10.2/29.
    - Host mars / vmbrNAS: 10.10.10.3/29.
    El enlace físico por ETH3 está negociado a 2,5 Gb/s full duplex.
    La máscara /30 y el uso de ETH7 del dibujo quedan sustituidos.

    ## Cargas identificadas en las últimas capturas
    VM100 docker-server; VM666 Kali; VM200 MikrotikCHR detenida;
    LXC101 unifi-controller; LXC102 Zabbix/Grafana.
    Configuraciones de los cinco invitados recibidas el 06-11-2026:
    VM100: 4 vCPU, 16 GiB, disco 65 GiB, arranque automático.
    VM200: 1 vCPU, 1 GiB, disco 10368 MiB; detenida, ambas NIC link_down=1.
    VM666: 3 vCPU, 6 GiB, disco 40 GiB, arranque automático.
    LXC101: 1 vCPU, 2 GiB, rootfs15 GiB, swap2 GiB, arranque automático.
    LXC102: 2 vCPU, 4 GiB, rootfs32 GiB, swap1 GiB, arranque automático.

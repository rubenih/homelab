    ether13 -> P19 Raspberry Pi / NUT, acceso VLAN50.
    ether16 -> router del operador, WAN por DHCP.
    ether4,6,8,10,12,14: deshabilitados en la captura.
    ether15: habilitado, sin enlace y sin pertenencia a los bridges mostrados.
    ether3,5,7: habilitados en BRIDGE30 pero sin enlace activo en esta captura.
    ether2 y ether16: enlace activo a 1 Gb/s full duplex, autonegociación completada.
    ether9, ether11 y ether13: enlace activo a 100 Mb/s full duplex.
    El propietario confirma el cableado ether9 -> P11 -> TV, sin equipo intermedio.
    La TV estaba apagada al tomar las salidas. Como observación puntual, la FDB
    aprendía por ether9:
    - XX:XX:XX:XX:XX:XX = Echo Dot Cocina, 10.0.50.248.
    - XX:XX:XX:XX:XX:XX = Echo Dot Dormitorio, 10.0.50.246.
    - XX:XX:XX:XX:XX:XX = Echo Dot Despacho, 10.0.50.253.
    La MAC de la TV XX:XX:XX:XX:XX:XX no aparece en la consulta de FDB y
    su entrada ARP 10.0.50.227 en BRIDGE50 figura como failed.
    La FDB confirma XX:XX:XX:XX:XX:XX (Hue) en ether11 y
    XX:XX:XX:XX:XX:XX (Raspberry Pi) en ether13.
    Esta observación no se usa para cambiar el cableado físico confirmado.
    Grupo 1, índices 0 y 1 = sfp-sfpplus1/2, 10 Gb/s; ambos deshabilitados.
    Las tomas de pared sin equipo final identificado se describen en notas;
    no se inventan dispositivos detrás de ellas.

    ## Segmentos del diagrama confirmado
    VLAN10 MGMT: 10.0.10.1/24.
    VLAN30 ADMIN: 10.0.30.1/24.
    VLAN31 DOCKER/VM: 10.0.31.1/24.
    VLAN32 SIN INTERNET: 10.0.32.1/24, verificado en /ip address.
    VLAN40 INVITADOS: 10.0.40.1/24.
    VLAN50 SMART HOME: 10.0.50.1/24.
    DHCP documentado para VLAN 10,30,31,40,50.
    Se corrige el error 172.32.32.0/24 del dibujo.
    VLAN20 existe sobre ether2 pero está deshabilitada y sin IP en la salida.
    Todas las interfaces 802.1Q VLAN10,20,30,31,32,40,50 dependen de ether2.

    ## Implementación efectiva de los puertos de acceso
    BRIDGE30 contiene VLAN30 y ether3, ether5, ether7.
    BRIDGE50 contiene VLAN50 y ether9, ether11, ether13.
    Ambos bridges tienen vlan-filtering=no, RSTP y MTU1500.
    Los puertos de bridge muestran PVID1, pero el filtrado VLAN está desactivado.
    El acceso a las redes 30 y 50 se realiza mediante el bridge con la
    subinterfaz VLAN30/VLAN50 de ether2, no mediante un PVID30/PVID50.
    Las entradas de /interface bridge vlan no aplican filtrado mientras esté
    desactivado; no se reinterpretan como configuración VLAN-aware activa.
    Las direcciones 10.0.30.1 y 10.0.50.1 aparecen configuradas en las
    interfaces VLAN30/VLAN50, con actual-interface BRIDGE30/BRIDGE50.

    ## VPN WireGuard
    wireguard1: 10.0.100.1/24, red VPN 10.0.100.0/24.
    El comentario la denomina VLAN100, pero no aparece una subinterfaz
    802.1Q VLAN100 en la salida; se documenta como red WireGuard.
    No se recopilan claves ni configuración de peers.

    ## WAN del diagrama
    Router del operador: 192.168.1.1/24 según diagrama.
    MikroTik WAN: 192.168.1.128/24, dirección dinámica observada en ether16.
    El comentario de ether16 identifica al operador como ISP.
    Cadena externa: ONT GPON -> router del operador -> ether16 MikroTik.
    DNAT del operador hacia 192.168.1.128: TCP80, TCP443 y TCP/UDP51820.
    Numeración física de los puertos del router del operador y modelo pendientes.

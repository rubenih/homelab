    management.ip: 10.0.10.16
  notes: |
    ## Identidad y función actual
    Hostname: earth. Proxmox VE independiente; no forma parte de un clúster.
    El servidor antiguo conserva su nombre en RackPeek.
    Aloja Moon (VM de Proxmox Backup Server) y Windows de family (VM 777).
    Ambas VM tienen arranque automático al encender earth.
    TrueNAS fue eliminado. Los dos HDD IronWolf de 4 TB se trasladaron al QNAP.
    Alimentación documentada desde el Legrand KEOR PDU 800.

    ## Discos físicos actuales
    1. Samsung SSD 850 EVO 250GB. SN: [redacted].
       Disco del sistema Proxmox: arranque UEFI y LVM.
    2. Samsung SSD 870 EVO 500GB. SN: [redacted].
       Disco asociado históricamente a Windows de family; sigue instalado.
    3. Intel S3520, INTEL SSDSC2BB960G7, 960 GB. SN: [redacted].
    4. Intel S3520, INTEL SSDSC2BB960G7, 960 GB. SN: [redacted].
    Los dos Intel están en espejo y almacenan las copias de Moon.
    El nombre del pool, la ruta del datastore y la capa donde se gestiona el
    espejo no se han recuperado; no se presupone passthrough ni un tipo de RAID.
    Los SN Samsung se recuperaron del registro UEFI del 07-10-2026;
    los SN Intel se verificaron en las salidas SMART del 06-10-2026.
    Las letras /dev/sdX son históricas y no se usan como identificadores.

    ## Numeración de puertos en este inventario
    Grupo 0, índice 0: Ethernet integrada; gestión de earth -> switch GE10.
      Descripción de GE10 en el Cisco: NIC0 - enp5s0.
    Grupo 0, índice 1: tarjeta PCIe, puerto inferior; trunk -> switch GE9.
      Descripción de GE9 en el Cisco: NIC2 - enp1s0f1.
    Los nombres se recuperan de las descripciones actuales del Cisco;
    no sustituyen una auditoría actual del sistema operativo de earth.
    GE9 y GE10 aparecen inactivos en las capturas del switch del 06-11-2026.
    Grupo 0, índice 2: tarjeta PCIe, puerto superior.
    El destino documentado del puerto superior es ETH1 de mars, vmbr1,
    según el fichero de red actual de mars y las notas anteriores de Wake-on-LAN.
    Se añade esa conexión documental con verificación física pendiente en earth.
    La referencia histórica de Linux para ese puerto es enp1s0f0; no revalidada.

    RAM y frecuencia conservadas del inventario anterior: 48 GB / 2133 MT/s.

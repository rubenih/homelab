    ## Hardware y función
    QNAP TS-435XeU. Gestión: 10.0.10.5/24.
    Nombre mostrado: QNAP-lab; host mostrado: nas.example.com.
    NAS separado para datos y almacenamiento compartido.
    Marvell OCTEON TX2 CN9131, Cortex-A72 de cuatro núcleos a 2,2 GHz.
    RAM instalada: 1 x 16 GB DDR4 SODIMM, según el diagrama.

    ## Discos físicos y ranuras
    M.2 2280, ranura 1: Sabrent NVMe 256 GB, 238,47 GB mostrados por QTS.
      SN [redacted]; firmware RKT343.4.
    M.2 2280, ranura 2: Sabrent NVMe 256 GB, 238,47 GB mostrados por QTS.
      SN [redacted]; firmware RKT303.3.
    La familia Rocket procede del diagrama; la GUI solo identifica modelo Sabrent.
    Las dos series se transcriben uniendo el último carácter que la GUI muestra
    en una segunda línea: 6 para la ranura1 y9 para la ranura2.
    Ambos NVMe figuran como Datos y con enlace PCIe Gen3x1 en la captura.
    Vida útil estimada capturada: 96% / 94%; no son valores de monitorización en vivo.
    Bandeja 1: Seagate IronWolf 4 TB, ST4000VN006-3CW104; SN [redacted].
    Bandeja 2: Seagate IronWolf 4 TB, ST4000VN006-3CW104; SN [redacted].
    Los discos de las bandejas 1 y 2 proceden del antiguo TrueNAS de earth.
    Bandejas3 y4: vacías, confirmado por el propietario y las capturas.
    Hay DOS IronWolf, no tres. La ampliación con un tercero se descartó al
    contratar Drime Cloud con6 TB; no se incluye ese disco previsto como instalado.
    Inventario físico actual: 2HDD + 2NVMe; cuatro unidades instaladas.

    ## Volúmenes observados
    Main: preparado, volumen Thick, capacidad mostrada2,78 TB.
    NVMe-System: preparado, volumen Thick, capacidad mostrada98,20 GB.
    La captura muestra0 instantáneas y sin programas de instantáneas en ambos.
    El propietario confirma dos grupos RAID1 independientes:
    - Los dos IronWolf forman el RAID1 de HDD para los datos de Main.
    - Los dos NVMe forman otro RAID1 independiente para NVMe-System.
    Los nombres/IDs concretos de los conjuntos no se han aportado.

    ## Puertos: respetar la numeración real QNAP
    Grupo 0, tipo sfp+, índices 0 y 1: puertos QNAP 1 y 2, 10 Gb/s.
    Grupo 1, tipo rj45, índice 0: puerto QNAP 3, 2,5 Gb/s -> switch GE5.
    Grupo 1, tipo rj45, índice 1: puerto QNAP 4, 2,5 Gb/s -> mars ETH3.
    Las capturas de Network del 06-11-2026 verifican:
    - Adaptadores1/2: SFP+10 Gb/s, desconectados, sin IP, MTU1500.
    - Adaptador3: Marvell CN913X integrado, MACXX:XX:XX:XX:XX:XX;
      IP estática10.0.10.5/24, gateway10.0.10.1;
      DNS primario10.0.10.1, secundario10.0.31.254;
      enlace1 Gb/s, MTU1500, sin etiqueta VLAN en el NAS.
    - Adaptador4: Marvell CN913X integrado, MACXX:XX:XX:XX:XX:XX;
      IP estática10.10.10.1/29, sin gateway ni DNS;
      enlace2,5 Gb/s, MTU1500, sin etiqueta VLAN en el NAS.
    El selector automático de gateway del sistema utiliza el adaptador3.
    La interfaz muestra el servicio WoL en los adaptadores3 y4.
    Los nombres de dispositivos Linux del QNAP no se deducen de la numeración
    de adaptadores de la GUI y no se inventan.
    En el switch el enlace de gestión está limitado a 1 Gb/s;
    el enlace NAS está negociado a 2,5 Gb/s full duplex en mars ETH3/nic7.
    Dirección NAS: 10.10.10.1/29.
    Referencias del fabricante para puertos y numeración:
    https://www.qnap.com/es-es/product/ts-435xeu/specs/hardware
    https://eu1.qnap.com/TechnicalDocument/Storage/SMB%20NAS/ts-435xeu/ts-435xeu-ug-01-es-es.pdf

    ## Copias recuperadas del contexto del 03-04/11/2026
    Export NFS /backups, accesible desde 10.10.10.1.
    Backups Proxmox organizados en proxmox/mars/docker-server,
    proxmox/mars/unifi-controller y proxmox/mars/zabbix-grafana.
    Los nombres qnap-docker, qnap-unifi y qnap-zabbix son almacenamientos
    de copias; no se afirma que los discos de las VM estén alojados ahí.

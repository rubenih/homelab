# Escaneo de secretos y de datos reales del lab en cada push y PR.
# Los patrones de datos reales se guardan en el secreto del repo LAB_PATTERNS
# (una expresión regular por línea), para no publicarlos en el propio workflow.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  real-lab-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar IPs, dominios y MACs reales
        env:
          LAB_PATTERNS: ${{ secrets.LAB_PATTERNS }}
        run: |
          if [ -z "$LAB_PATTERNS" ]; then echo "::error::Falta el secreto LAB_PATTERNS"; exit 1; fi
          printf '%s\n' "$LAB_PATTERNS" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' > /tmp/patterns
          echo "Patrones cargados: $(wc -l < /tmp/patterns)"
          # -l: solo nombres de fichero, para no volcar datos reales en el log público
          if git grep -lIE -f /tmp/patterns -- . ':!.github'; then
            echo "::error::Hay datos reales del lab en el repo"; exit 1
          fi
